<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/png" href="glorex_bull_gold.png"/>
<link rel="apple-touch-icon" href="glorex_bull_gold.png"/>
<title>الدروس — GLOREX</title>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#D4A017;--gold-l:#F0C030;--gold-d:#A07810;
  --bg:#080808;--surface:#0d0d0d;--card:#111111;
  --border:rgba(255,255,255,0.08);
  --txt:#fff;--txt2:#ccc;--txt3:#999;--txt4:#666;
  --ease:cubic-bezier(.4,0,.2,1);--base:.3s;
  --green:#22c55e;
}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}

.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 900px 700px at 80% 0%,rgba(212,160,23,.10),transparent 60%),radial-gradient(ellipse 600px 800px at 0% 100%,rgba(160,120,16,.08),transparent 60%)}

.topbar{position:sticky;top:0;z-index:100;background:rgba(8,8,8,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:.95rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem}
.brand-logo{width:40px;height:40px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 8px rgba(212,160,23,.4))}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:'Space Grotesk';font-weight:700;font-size:1.1rem;letter-spacing:2px;color:#fff}
.nav-tabs{display:flex;gap:.4rem}
.nav-tab{padding:.55rem 1.1rem;border-radius:10px;color:var(--txt3);font-size:.88rem;font-weight:500;transition:all var(--base) var(--ease)}
.nav-tab:hover{color:var(--txt);background:rgba(255,255,255,.04)}
.nav-tab.active{color:var(--gold);background:rgba(212,160,23,.1)}
.user-name{font-size:.88rem;color:var(--txt3)}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold-l),var(--gold-d));display:flex;align-items:center;justify-content:center;color:#000;font-weight:700;font-size:.92rem;font-family:'Space Grotesk'}
.user-menu{display:flex;align-items:center;gap:.7rem}

/* ============ MAIN LAYOUT ============ */
.wrap{
  max-width:1400px;margin:0 auto;padding:1.5rem 1.25rem 3rem;
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 380px;gap:1.5rem;
  align-items:start;
}

/* ============ VIDEO SECTION ============ */
.video-section{ min-width:0 }
.video-wrap{
  position:relative;padding-top:56.25%;
  border-radius:16px;overflow:hidden;
  background:#000;
  border:1px solid var(--border);
  box-shadow:0 20px 60px -20px rgba(0,0,0,.6);
}
.video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* Lesson info */
.lesson-info{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:1.6rem 1.8rem;
  margin-top:1.25rem;
}
.li-crumb{
  color:var(--gold);font-size:.78rem;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:.6rem;
}
.li-title{
  font-family:'Space Grotesk';
  font-size:1.7rem;font-weight:700;
  margin-bottom:.6rem;line-height:1.3;
}
.li-meta{
  display:flex;gap:1.2rem;flex-wrap:wrap;
  color:var(--txt3);font-size:.85rem;margin-bottom:1rem;
}
.li-meta span{display:inline-flex;align-items:center;gap:.35rem}
.li-meta i{color:var(--gold)}
.li-desc{color:var(--txt2);font-size:.95rem;line-height:1.75}

.lesson-actions{
  display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem;
  padding-top:1.2rem;border-top:1px solid var(--border);
}
.btn{
  padding:.7rem 1.3rem;border-radius:10px;font-weight:600;
  font-family:inherit;font-size:.9rem;cursor:pointer;
  display:inline-flex;align-items:center;gap:.5rem;
  transition:all .2s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--gold-l),var(--gold-d));color:#000;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px -6px rgba(212,160,23,.5)}
.btn-primary.done{background:linear-gradient(135deg,#4ade80,#16a34a)}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--txt2);
}
.btn-ghost:hover{border-color:rgba(212,160,23,.4);color:var(--gold-l)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ============ SIDEBAR (LESSONS LIST) ============ */
.sidebar{
  position:sticky;top:5rem;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:1.2rem;
  max-height:calc(100vh - 6rem);
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(212,160,23,.25);border-radius:3px}

.side-head{
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:.9rem;margin-bottom:.9rem;
  border-bottom:1px solid var(--border);
}
.side-title{
  font-family:'Space Grotesk';
  font-size:1rem;font-weight:700;color:var(--gold-l);
}
.side-progress{
  background:rgba(212,160,23,.1);color:var(--gold);
  padding:.25rem .7rem;border-radius:20px;
  font-size:.75rem;font-weight:700;font-family:'Space Grotesk';
}

.progress-bar{
  height:5px;background:rgba(255,255,255,.05);border-radius:3px;
  overflow:hidden;margin-bottom:1rem;
}
.progress-fill{
  height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));
  border-radius:3px;transition:width .5s ease;
}

.lesson-list{display:flex;flex-direction:column;gap:.4rem}
.lesson-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.75rem .85rem;border-radius:10px;
  border:1px solid transparent;
  transition:all .2s;cursor:pointer;
  background:rgba(255,255,255,.02);
  text-align:right;
  width:100%;
}
.lesson-item:hover:not(.locked){background:rgba(212,160,23,.06);border-color:rgba(212,160,23,.2)}
.lesson-item.active{
  background:rgba(212,160,23,.12);border-color:var(--gold);
}
.lesson-item.locked{opacity:.5;cursor:not-allowed}
.lesson-item.done .li-num{background:var(--green);color:#000}
.li-num{
  flex-shrink:0;
  width:32px;height:32px;border-radius:8px;
  background:rgba(212,160,23,.15);color:var(--gold-l);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk';font-weight:700;font-size:.85rem;
}
.lesson-item.active .li-num{background:var(--gold);color:#000}
.li-info{flex:1;min-width:0}
.li-name{
  font-size:.9rem;font-weight:600;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lesson-item.active .li-name{color:var(--gold-l)}
.li-dur{
  color:var(--txt4);font-size:.72rem;
  font-family:'Space Grotesk';margin-top:.15rem;
}
.li-lock{color:var(--txt4);font-size:.85rem;flex-shrink:0}

/* ============ MOBILE ============ */
@media (max-width:960px){
  .wrap{grid-template-columns:1fr;padding:1rem}
  .sidebar{position:static;max-height:none;order:-1}
  .lesson-list{max-height:280px;overflow-y:auto}
}
@media (max-width:768px){
  .topbar{padding:.7rem 1rem}
  .nav-tabs{display:none}
  .lesson-info{padding:1.2rem 1.3rem}
  .li-title{font-size:1.3rem}
}

/* Toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card);border:1px solid var(--border);
  padding:.85rem 1.4rem;border-radius:10px;font-size:.88rem;
  opacity:0;transition:all .3s;z-index:1000;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="bg-mesh"></div>

<header class="topbar">
  <a href="glorex_landing.html" class="brand">
    <div class="brand-logo"><img src="glorex_bull_gold.png" alt="GLOREX"/></div>
    <div class="brand-name">GLOREXFX.COM</div>
  </a>
  <nav class="nav-tabs">
    <a href="dashboard.html" class="nav-tab">الرئيسية</a>
    <a href="checklist.html" class="nav-tab">القائمة</a>
    <a href="journal.html" class="nav-tab">السجل</a>
    <a href="calendar.html" class="nav-tab">التقويم</a>
    <a href="news.html" class="nav-tab">الأخبار</a>
    <a href="lessons.html" class="nav-tab active">الدروس</a>
    <a href="updates.html" class="nav-tab">التحديثات</a>
    <a href="chat.html" class="nav-tab">المحادثة</a>
  </nav>
  <div class="user-menu">
    <span class="user-name" id="userName">...</span>
    <div class="user-avatar" id="userAvatar">G</div>
  </div>
</header>

<div class="wrap">

  <!-- VIDEO + INFO -->
  <div class="video-section">
    <div class="video-wrap">
      <iframe id="videoFrame" src="" loading="lazy"
        allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture"
        allowfullscreen></iframe>
    </div>

    <div class="lesson-info">
      <div class="li-crumb" id="crumb">الدرس 1 من 15</div>
      <h1 class="li-title" id="title">جاري التحميل...</h1>
      <div class="li-meta">
        <span><i class="far fa-clock"></i> <span id="dur">—</span></span>
        <span><i class="fas fa-video"></i> <span id="level">مقدمة</span></span>
      </div>
      <p class="li-desc" id="desc"></p>

      <div class="lesson-actions">
        <button class="btn btn-primary" id="doneBtn">
          <i class="fas fa-check"></i> <span>وضع علامة "تم"</span>
        </button>
        <button class="btn btn-ghost" id="prevBtn">
          <i class="fas fa-arrow-right"></i> السابق
        </button>
        <button class="btn btn-ghost" id="nextBtn">
          التالي <i class="fas fa-arrow-left"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="side-head">
      <div class="side-title">📚 المنهج الكامل</div>
      <div class="side-progress"><span id="progNum">0</span>/<span id="progTotal">15</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <div class="lesson-list" id="lessonList"></div>
  </aside>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from './supabase-client.js';
import { setupUserMenu } from './user-menu.js?v=20260702';

// ============================================================
// LESSONS DATA — add new ones here as they get uploaded
// ============================================================
const LIBRARY_ID = 695904;
const LESSONS = [
  { id:1, title:'البداية — أهلاً في GLOREX', videoId:'23979d5c-4bfe-4b4e-a910-e7987cdae107', dur:'6:16', level:'مقدمة', desc:'تعرف على منهج GLOREX الكامل، ما ستتعلمه، وكيف تحقق أقصى استفادة من الدروس.' },
  { id:2, title:'إتقان منصة TradingView', videoId:'a9a19b1c-6f8f-4b80-919f-9f05da4f9a27', dur:'', level:'أساسي', desc:'كل شي عن TradingView — الإعدادات، الأدوات، والاختصارات اللي بتوفرلك وقت.' },
  { id:3, title:'الدعوم والمقاومات — أساس التحليل', videoId:'017d0d9d-7908-4e70-904b-e9f072881be3', dur:'', level:'أساسي', desc:'كيف تحدد مستويات الدعوم والمقاومات الحقيقية — القواعد الذهبية والأمثلة العملية.' },
  { id:4, title:'الدعوم تصبح مقاومات والعكس (SBR/RBS)', videoId:'fb66377f-05fe-4836-b4bf-14459dd26002', dur:'', level:'أساسي', desc:'أقوى مفهوم بالتحليل الفني — كيف تستغل انقلاب المستويات لصفقات ذهبية.' },
  { id:5, title:'قراءة الاتجاه — صاعد / هابط / عرضي', videoId:'7ee51d09-8280-4a6d-9df2-3dc48ce2a1d8', dur:'', level:'أساسي', desc:'كيف تعرف اتجاه السوق بلحظتها — HH/HL للصاعد، LH/LL للهابط، وكيف تتعامل مع كل حالة.' },
  { id:6, title:'مناطق العرض والطلب (Supply & Demand)', videoId:'1f3a4c2e-faac-49c4-910b-86336ae23955', dur:'', level:'متوسط', desc:'الفرق بين خطوط الدعم/المقاومة ومناطق العرض/الطلب — كيف تحدد المناطق الأصلية.' },
  { id:7, title:'الفريم الكبير (HTF) — الرؤية الشاملة', videoId:'2fbe8a67-767d-44d0-b920-56b5972fc734', dur:'', level:'متوسط', desc:'ليش الفريم الكبير هو المرجع — Weekly / Daily / 4H، وكيف تحدد المناطق الأقوى.' },
  { id:8, title:'الفريم الصغير (LTF) — نقاط الدخول', videoId:'8294f985-de46-47f1-8a26-98754df8290e', dur:'', level:'متوسط', desc:'كيف تستخدم الفريم الصغير للدخول بدقة — 15M / 5M / 1M.' },
  { id:9, title:'سحب السيولة + تأكيد الدخول', videoId:'17e3142b-f7a0-417a-a536-3698e203a391', dur:'', level:'متقدم', desc:'كيف تستغل سحب السيولة كتأكيد قوي للدخول بالصفقات.' },
  { id:10, title:'الستوب لوس والهدف — R:R 1:2', videoId:'2ecc96c1-2343-4f05-9203-3c6e1abad2e3', dur:'', level:'متقدم', desc:'كيف تحدد وقف الخسارة والهدف بنسبة مخاطرة/عائد صحيحة.' },
  { id:11, title:'خطة التداول + النفسية + شرح الموقع', videoId:'1b997983-2092-4461-88f4-42bfff0078ca', dur:'', level:'خاتمة', desc:'كل شي عن بناء خطة تداولك، الجانب النفسي، وكيف تستخدم كل ميزة بالموقع.' },
];

let currentIdx = 0;
let completed = new Set();

// Load progress from localStorage
try {
  const saved = JSON.parse(localStorage.getItem('glorex_lessons_done') || '[]');
  completed = new Set(saved);
} catch(e){}

function saveProgress(){
  try { localStorage.setItem('glorex_lessons_done', JSON.stringify([...completed])); } catch(e){}
}

function renderList(){
  const list = document.getElementById('lessonList');
  list.innerHTML = LESSONS.map((l, i) => {
    const locked = l.status === 'coming';
    const done = completed.has(l.id);
    const active = i === currentIdx;
    return `<button class="lesson-item ${active?'active':''} ${locked?'locked':''} ${done?'done':''}" data-idx="${i}" ${locked?'disabled':''}>
      <div class="li-num">${done && !active ? '<i class="fas fa-check"></i>' : l.id}</div>
      <div class="li-info">
        <div class="li-name">${l.title}</div>
        <div class="li-dur">${l.dur || 'قريباً'} · ${l.level || ''}</div>
      </div>
      ${locked ? '<i class="fas fa-lock li-lock"></i>' : ''}
    </button>`;
  }).join('');
  list.querySelectorAll('.lesson-item:not(.locked)').forEach(el => {
    el.addEventListener('click', () => loadLesson(parseInt(el.dataset.idx)));
  });

  // Progress bar
  const total = LESSONS.filter(l => l.status !== 'coming').length;
  const done = [...completed].filter(id => LESSONS.some(l => l.id === id && l.status !== 'coming')).length;
  document.getElementById('progNum').textContent = done;
  document.getElementById('progTotal').textContent = total;
  document.getElementById('progFill').style.width = (total ? (done/total)*100 : 0) + '%';
}

function loadLesson(idx){
  const l = LESSONS[idx];
  if(!l || l.status === 'coming') return;
  currentIdx = idx;

  document.getElementById('videoFrame').src =
    `https://iframe.mediadelivery.net/embed/${LIBRARY_ID}/${l.videoId}?autoplay=false&loop=false&muted=false&preload=true&responsive=true`;
  document.getElementById('title').textContent = l.title;
  document.getElementById('crumb').textContent = `الدرس ${l.id} من ${LESSONS.length}`;
  document.getElementById('dur').textContent = l.dur || '—';
  document.getElementById('level').textContent = l.level || '';
  document.getElementById('desc').textContent = l.desc || '';

  // Update done button
  const doneBtn = document.getElementById('doneBtn');
  if(completed.has(l.id)){
    doneBtn.classList.add('done');
    doneBtn.querySelector('span').textContent = '✓ تم إكماله';
  } else {
    doneBtn.classList.remove('done');
    doneBtn.querySelector('span').textContent = 'وضع علامة "تم"';
  }

  // Nav buttons
  const prev = LESSONS.slice(0, idx).reverse().find(x => x.status !== 'coming');
  const next = LESSONS.slice(idx + 1).find(x => x.status !== 'coming');
  document.getElementById('prevBtn').disabled = !prev;
  document.getElementById('nextBtn').disabled = !next;
  document.getElementById('prevBtn').dataset.idx = prev ? LESSONS.indexOf(prev) : -1;
  document.getElementById('nextBtn').dataset.idx = next ? LESSONS.indexOf(next) : -1;

  renderList();
  // Scroll to top on mobile
  if(window.innerWidth < 960) document.getElementById('videoFrame').scrollIntoView({behavior:'smooth', block:'start'});

  // Save last watched
  try { localStorage.setItem('glorex_last_lesson', l.id); } catch(e){}
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('doneBtn').addEventListener('click', () => {
  const l = LESSONS[currentIdx];
  if(!l) return;
  if(completed.has(l.id)){
    completed.delete(l.id);
    toast('أُلغيت علامة الإكمال');
  } else {
    completed.add(l.id);
    toast('✓ ممتاز! تم إكمال الدرس');
  }
  saveProgress();
  loadLesson(currentIdx);
});

document.getElementById('prevBtn').addEventListener('click', (e) => {
  const idx = parseInt(e.currentTarget.dataset.idx);
  if(idx >= 0) loadLesson(idx);
});
document.getElementById('nextBtn').addEventListener('click', (e) => {
  const idx = parseInt(e.currentTarget.dataset.idx);
  if(idx >= 0) loadLesson(idx);
});

// Auth setup
async function init(){
  try{
    const { data:{session} } = await supabase.auth.getSession();
    if(session){
      const fn = session.user.user_metadata?.first_name || session.user.email.split('@')[0];
      document.getElementById('userName').textContent = fn;
      document.getElementById('userAvatar').textContent = (fn[0]||'G').toUpperCase();
      await setupUserMenu(session.user);
    } else {
      document.getElementById('userName').textContent = 'زائر';
    }
  }catch(e){ document.getElementById('userName').textContent = 'زائر'; }

  // Load last watched lesson or first available
  let startIdx = 0;
  try {
    const lastId = parseInt(localStorage.getItem('glorex_last_lesson') || '1');
    const found = LESSONS.findIndex(l => l.id === lastId && l.status !== 'coming');
    if(found >= 0) startIdx = found;
  } catch(e){}

  loadLesson(startIdx);
}
init();
</script>

<script type="module" src="./splash.js?v=20260702"></script>

<!-- Content protection (basic anti-copy) -->
<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey) && ['s','p','u','a','c'].includes(k)) e.preventDefault();
  if(e.key === 'F12') e.preventDefault();
});
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('selectstart', e => {
  if(e.target.closest('input,textarea')) return;
  e.preventDefault();
});
</script>
