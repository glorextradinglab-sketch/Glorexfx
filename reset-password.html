<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/png" href="glorex_bull_gold.png"/>
<link rel="apple-touch-icon" href="glorex_bull_gold.png"/>
<title>تعيين كلمة مرور جديدة — GLOREX</title>
<meta name="theme-color" content="#0a0a0a"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#D4A017;--gold-l:#F0C030;--gold-d:#A07810;--bg:#080808;--card:#111;--border:rgba(255,255,255,.08);--border-h:rgba(212,160,23,.4);--txt:#fff;--txt2:#ccc;--txt3:#999;--txt4:#666}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at top,rgba(212,160,23,.10),transparent 60%);pointer-events:none;z-index:0}
.card{width:100%;max-width:440px;background:linear-gradient(180deg,#101014,#050505);border:1px solid var(--border);border-radius:22px;padding:2.5rem 2rem;position:relative;z-index:1;box-shadow:0 40px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(212,160,23,.08)}
.brand{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:2rem}
.brand img{width:38px;height:38px;object-fit:contain}
.brand span{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:1.2rem;letter-spacing:2px;color:#fff}
.eyebrow{text-align:center;color:var(--gold);font-size:.75rem;font-weight:700;letter-spacing:3px;margin-bottom:.7rem;text-transform:uppercase}
h1{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:.6rem}
.sub{text-align:center;color:var(--txt3);font-size:.9rem;margin-bottom:2rem;line-height:1.7}
.field{margin-bottom:1.1rem}
.field-lbl{display:block;font-size:.85rem;font-weight:600;color:var(--txt2);margin-bottom:.5rem;text-align:right}
.field-wrap{position:relative}
.field-input{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:.9rem 2.8rem .9rem 1rem;color:#fff;font-size:.95rem;font-family:inherit;transition:border-color .2s ease,background .2s ease;text-align:right;direction:rtl}
.field-input:focus{outline:0;border-color:var(--border-h);background:rgba(212,160,23,.04)}
.field-input::placeholder{color:var(--txt4)}
.field-ico{position:absolute;top:50%;right:1rem;transform:translateY(-50%);color:var(--txt4);pointer-events:none;font-size:.9rem}
.field-toggle-pwd{position:absolute;top:50%;left:.9rem;transform:translateY(-50%);background:none;border:0;color:var(--txt4);cursor:pointer;font-size:.95rem;padding:.4rem}
.field-toggle-pwd:hover{color:var(--gold)}
.field-hint{font-size:.78rem;color:var(--txt4);margin-top:.4rem;text-align:right;line-height:1.5}
.btn-submit{width:100%;background:linear-gradient(135deg,var(--gold-l),var(--gold));color:#0a0a0a;border:0;border-radius:12px;padding:1rem;font-weight:800;font-size:1rem;font-family:'Space Grotesk',sans-serif;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:transform .2s ease,box-shadow .2s ease;margin-top:.7rem;box-shadow:0 20px 50px -15px rgba(212,160,23,.5)}
.btn-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 25px 60px -15px rgba(212,160,23,.65)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.foot{text-align:center;margin-top:1.5rem;font-size:.85rem;color:var(--txt3)}
.foot a{color:var(--gold);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}
.status-msg{text-align:center;padding:1rem;border-radius:12px;font-size:.9rem;margin-bottom:1.2rem;display:none}
.status-msg.err{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.status-msg.ok{display:block;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
.status-msg.info{display:block;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <img src="glorex_bull_gold.png" alt="GLOREX"/>
    <span>GLOREX</span>
  </div>

  <div id="statusMsg" class="status-msg"></div>

  <div id="formWrap">
    <div class="eyebrow">🔒 استعادة الحساب</div>
    <h1>عيّن كلمة مرور جديدة</h1>
    <p class="sub">اكتب كلمة المرور الجديدة مرتين. لازم تكون 8 أحرف على الأقل.</p>

    <form id="resetForm" autocomplete="off">
      <div class="field">
        <label class="field-lbl" for="pwd">كلمة المرور الجديدة</label>
        <div class="field-wrap">
          <i class="fas fa-lock field-ico"></i>
          <input id="pwd" type="password" class="field-input" placeholder="••••••••" minlength="8" required autocomplete="new-password"/>
          <button type="button" class="field-toggle-pwd" data-target="pwd" aria-label="إظهار/إخفاء"><i class="fas fa-eye"></i></button>
        </div>
        <p class="field-hint">8 أحرف أو أكثر — يفضل تخليها قوية وصعبة التخمين</p>
      </div>

      <div class="field">
        <label class="field-lbl" for="pwd2">تأكيد كلمة المرور</label>
        <div class="field-wrap">
          <i class="fas fa-lock field-ico"></i>
          <input id="pwd2" type="password" class="field-input" placeholder="••••••••" minlength="8" required autocomplete="new-password"/>
          <button type="button" class="field-toggle-pwd" data-target="pwd2" aria-label="إظهار/إخفاء"><i class="fas fa-eye"></i></button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        حفظ كلمة المرور <i class="fas fa-check"></i>
      </button>
    </form>

    <p class="foot"><a href="signin.html">← الرجوع لتسجيل الدخول</a></p>
  </div>
</div>

<script type="module">
import { supabase, updatePassword, translateError } from './supabase-client.js';

const statusEl = document.getElementById('statusMsg');
const formWrap = document.getElementById('formWrap');

function showStatus(msg, kind='info'){
  statusEl.className = 'status-msg ' + kind;
  statusEl.textContent = msg;
}

/* Password show/hide */
document.querySelectorAll('.field-toggle-pwd').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const inp=document.getElementById(btn.dataset.target);
    const icon=btn.querySelector('i');
    if(inp.type==='password'){inp.type='text';icon.className='fas fa-eye-slash'}
    else{inp.type='password';icon.className='fas fa-eye'}
  });
});

/* Wait for Supabase to process the recovery token from the URL hash */
let hasRecoverySession = false;
supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
    hasRecoverySession = true;
  }
});

/* Fallback check: if no session after 1.2s, show error */
setTimeout(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session && !hasRecoverySession) {
    showStatus('الرابط منتهي الصلاحية أو غير صحيح. اطلب رابط جديد من صفحة تسجيل الدخول.', 'err');
    document.getElementById('btnSubmit').disabled = true;
  } else {
    hasRecoverySession = true;
  }
}, 1200);

/* Submit new password */
document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btnSubmit');
  const p1 = document.getElementById('pwd').value;
  const p2 = document.getElementById('pwd2').value;

  if (p1.length < 8)      { showStatus('كلمة المرور لازم تكون 8 أحرف على الأقل', 'err'); return; }
  if (p1 !== p2)          { showStatus('كلمتا المرور غير متطابقتين', 'err'); return; }

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري الحفظ...';

  const { error } = await updatePassword(p1);

  if (error) {
    showStatus(translateError(error), 'err');
    btn.disabled = false;
    btn.innerHTML = 'حفظ كلمة المرور <i class="fas fa-check"></i>';
    return;
  }

  showStatus('✓ تم تحديث كلمة المرور بنجاح. جاري التحويل لتسجيل الدخول...', 'ok');
  btn.innerHTML = '<i class="fas fa-check"></i> تم';
  await supabase.auth.signOut();
  setTimeout(() => location.href = 'signin.html', 1500);
});
</script>

</body>
</html>
